// ---------- scoring helpers ----------

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

function scorePE(pe, industryPe) {
  if (!pe || !industryPe) return 50;
  const ratio = pe / industryPe;
  if (ratio <= 0.7) return 90;
  if (ratio <= 1) return 72;
  if (ratio <= 1.3) return 50;
  if (ratio <= 1.6) return 32;
  return 15;
}

function scoreROE(roe) {
  if (roe === "" || roe === null || roe === undefined) return 50;
  if (roe >= 22) return 92;
  if (roe >= 15) return 75;
  if (roe >= 10) return 55;
  if (roe >= 5) return 35;
  return 15;
}

function scoreDE(de) {
  if (de === "" || de === null || de === undefined) return 50;
  if (de <= 0.3) return 90;
  if (de <= 0.6) return 75;
  if (de <= 1) return 55;
  if (de <= 1.5) return 35;
  return 15;
}

const MARGIN_SCORE = { Improving: 88, Stable: 58, Declining: 22 };
const PROMOTER_SCORE = { Increasing: 90, Stable: 60, Decreasing: 30, Pledging: 10 };
const MACD_SCORE = { Bullish: 90, Neutral: 50, Bearish: 12 };
const VOLUME_SCORE = { High: 82, Normal: 52, Low: 30 };
const PIVOT_SCORE = { AboveR1: 85, Between: 50, BelowS1: 18 };

function scoreRSI(rsi) {
  if (rsi === "" || rsi === null || rsi === undefined) return 50;
  if (rsi > 70) return 42;
  if (rsi >= 55) return 84;
  if (rsi >= 45) return 60;
  if (rsi >= 30) return 46;
  return 55;
}

function average(arr) {
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}

function verdictFor(score) {
  if (score >= 65) return { label: "BUY", tone: "emerald" };
  if (score >= 42) return { label: "HOLD", tone: "amber" };
  return { label: "AVOID", tone: "red" };
}

function toneClasses(tone) {
  switch (tone) {
    case "emerald":
      return { text: "text-emerald-400", bg10: "bg-emerald-500/10", border: "border-emerald-500/40" };
    case "amber":
      return { text: "text-amber-400", bg10: "bg-amber-500/10", border: "border-amber-500/40" };
    default:
      return { text: "text-red-400", bg10: "bg-red-500/10", border: "border-red-500/40" };
  }
}

function computeScores(s) {
  const fundamentalScore = average([
    scorePE(s.pe, s.industryPe),
    scoreROE(s.roe),
    scoreDE(s.de),
    MARGIN_SCORE[s.margin] ?? 58,
    PROMOTER_SCORE[s.promoter] ?? 60,
  ]);
  const technicalScore = average([
    scoreRSI(s.rsi),
    MACD_SCORE[s.macd] ?? 50,
    s.dma50 === "Above" ? 80 : 20,
    s.dma200 === "Above" ? 80 : 20,
    VOLUME_SCORE[s.volume] ?? 52,
  ]);
  const intradayScore = average([
    s.vwap === "Above" ? 75 : 25,
    PIVOT_SCORE[s.pivot] ?? 50,
    MACD_SCORE[s.macd] ?? 50,
    scoreRSI(s.rsi),
  ]);
  const ltCombined = fundamentalScore * 0.6 + technicalScore * 0.4;
  const idCombined = intradayScore * 0.7 + technicalScore * 0.3;
  const ltVerdict = verdictFor(ltCombined);
  const idVerdict = verdictFor(idCombined);

  const notes = [];
  if (fundamentalScore < 40) notes.push("Weak fundamentals — don't add on dips until margins/ROE stabilise.");
  if (s.de > 1.2) notes.push("High leverage — recheck debt levels each quarter; exit if D/E keeps climbing.");
  if (s.promoter === "Pledging") notes.push("Promoter pledging flagged — elevated risk, consider trimming.");
  if (s.rsi > 72) notes.push("RSI overheated — tighten trailing stop, book partial profits.");
  notes.push(
    ltVerdict.label === "BUY"
      ? "Long-term exit trigger: trail stop ~12% below swing low; reassess after each quarterly result."
      : ltVerdict.label === "HOLD"
      ? "Long-term: hold with a defined stop; re-review after next results before adding more."
      : "Long-term: avoid fresh buying; exit existing holding on any technical bounce."
  );
  notes.push(
    idVerdict.label === "AVOID"
      ? "Intraday: avoid fresh longs; square off existing position on a break below VWAP."
      : "Intraday: book at target or square off by 3:15 PM, whichever comes first."
  );

  return { fundamentalScore, technicalScore, intradayScore, ltCombined, idCombined, ltVerdict, idVerdict, notes };
}

// ---------- Screener.in import helpers ----------
// Screener.in has no public CORS-open live API, so this app can't "live fetch" it
// from the browser. Instead: paste a CSV exported from a Screener.in custom screen,
// or paste the raw text copied off a company page — both are parsed locally below.

function parseNum(v) {
  if (v === undefined || v === null) return "";
  const cleaned = String(v).replace(/[,%₹\s]/g, "").replace(/Rs\.?/gi, "");
  const n = parseFloat(cleaned);
  return isNaN(n) ? "" : n;
}

function findHeader(headers, patterns) {
  return headers.find((h) => patterns.some((p) => p.test(h)));
}

// Parses a CSV exported from a Screener.in custom screen (or pasted spreadsheet data).
// Returns { rows, mapped, unmapped, count } — rows are ready to append to the Screener.
function parseScreenerCSV(csvText) {
  const parsed = Papa.parse(csvText.trim(), { header: true, skipEmptyLines: true });
  const data = parsed.data.filter((r) => Object.values(r).some((v) => String(v || "").trim() !== ""));
  if (data.length === 0) return { rows: [], mapped: [], unmapped: [], count: 0 };

  const headers = Object.keys(data[0]);
  const colMap = {
    ticker: findHeader(headers, [/name/i, /company/i, /symbol/i]),
    currentPrice: findHeader(headers, [/cmp/i, /current price/i, /\bprice\b/i]),
    pe: findHeader(headers, [/^p\/?e$/i, /p\/e/i, /\bpe\b/i]),
    roe: findHeader(headers, [/roe/i]),
    de: findHeader(headers, [/debt.*eq/i, /d\/e/i]),
  };
  const mapped = Object.entries(colMap).filter(([, v]) => v).map(([k]) => k);
  const unmapped = Object.entries(colMap).filter(([, v]) => !v).map(([k]) => k);

  const rows = data.map((r, i) => ({
    ...newScreenerRow(),
    ticker: (colMap.ticker ? String(r[colMap.ticker] || "").trim() : `ROW${i + 1}`).toUpperCase().slice(0, 24) || `ROW${i + 1}`,
    currentPrice: colMap.currentPrice ? parseNum(r[colMap.currentPrice]) : "",
    pe: colMap.pe ? parseNum(r[colMap.pe]) : "",
    roe: colMap.roe ? parseNum(r[colMap.roe]) : "",
    de: colMap.de ? parseNum(r[colMap.de]) : "",
  }));

  return { rows, mapped, unmapped, count: rows.length };
}

// Parses raw text copied off a single Screener.in company page (ratios section).
function parseSingleStockText(text) {
  const get = (re) => {
    const m = text.match(re);
    return m ? parseNum(m[1]) : "";
  };
  const firstLine = text.split("\n").map((l) => l.trim()).find((l) => l.length > 1 && l.length < 40);
  return {
    ...newScreenerRow(),
    ticker: (firstLine || "IMPORTED").toUpperCase().slice(0, 24),
    currentPrice: get(/Current [Pp]rice[^\d]*([\d,]+\.?\d*)/) || get(/CMP[^\d]*([\d,]+\.?\d*)/),
    pe: get(/Stock P\/E[^\d]*([\d.]+)/) || get(/\bP\/E\b[^\d]*([\d.]+)/),
    industryPe: get(/Industry P\/E[^\d]*([\d.]+)/),
    roe: get(/ROE[^\d]*([\d.]+)/),
    de: get(/Debt to [Ee]quity[^\d]*([\d.]+)/),
  };
}

// ---------- gauge ----------

function Gauge({ score, label }) {
  const r = 78;
  const cx = 100;
  const cy = 104;
  const totalLen = Math.PI * r;
  const seg = totalLen / 3;
  const pathD = `M ${cx - r},${cy} A ${r},${r} 0 1 1 ${cx + r},${cy}`;
  const angle = (clamp(score, 0, 100) / 100) * 180 - 90;

  return (
    <div className="flex flex-col items-center">
      <svg viewBox="0 0 200 120" className="w-full max-w-[170px]">
        <path d={pathD} fill="none" stroke="#7f1d1d" strokeWidth="14" strokeLinecap="round" strokeDasharray={`${seg} ${totalLen}`} strokeDashoffset={0} opacity="0.9" />
        <path d={pathD} fill="none" stroke="#78350f" strokeWidth="14" strokeLinecap="round" strokeDasharray={`${seg} ${totalLen}`} strokeDashoffset={-seg} opacity="0.9" />
        <path d={pathD} fill="none" stroke="#065f46" strokeWidth="14" strokeLinecap="round" strokeDasharray={`${seg} ${totalLen}`} strokeDashoffset={-seg * 2} opacity="0.9" />
        <line x1={cx} y1={cy} x2={cx} y2={cy - r + 14} stroke="#e5e7eb" strokeWidth="3" transform={`rotate(${angle} ${cx} ${cy})`} strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="6" fill="#e5e7eb" />
      </svg>
      <div className="-mt-3 font-mono text-2xl font-semibold text-slate-100">{Math.round(score)}</div>
      <div className="text-[11px] uppercase tracking-widest text-slate-500">{label}</div>
    </div>
  );
}

function NumberField({ label, value, onChange, placeholder, hint }) {
  return (
    <Field label={label} hint={hint}>
      <input type="number" className={inputCls} value={value} placeholder={placeholder}
        onChange={(e) => onChange(e.target.value === "" ? "" : parseFloat(e.target.value))} />
    </Field>
  );
}

function SelectField({ label, value, onChange, options, hint }) {
  return (
    <Field label={label} hint={hint}>
      <select className={selectCls} value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => (<option key={o} value={o}>{o}</option>))}
      </select>
    </Field>
  );
}

  dma50: "Above", dma200: "Above", volume: "Normal", vwap: "Above", pivot: "Between",
};

function newScreenerRow() {
  return {
    id: `row-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    ticker: "", sector: SECTORS[0], currentPrice: "", pe: "", industryPe: "", roe: "", de: "",
    margin: "Stable", promoter: "Stable", rsi: "", macd: "Neutral",
    dma50: "Above", dma200: "Above", volume: "Normal", vwap: "Above", pivot: "Between",
  };
}

function StockAnalyzer() {
  const [tab, setTab] = useState("screener");

  // analyzer (single stock deep dive)
  const [form, setForm] = useState(defaultForm);
  const [result, setResult] = useState(null);
  const [exchange, setExchange] = useState("NSE");

  // watchlist
  const [watchlist, setWatchlist] = useState([]);
  const [loadingList, setLoadingList] = useState(true);
  const [saveMsg, setSaveMsg] = useState("");
  const [checkPrices, setCheckPrices] = useState({});

  // screener
  const [rows, setRows] = useState([]);
  const [loadingRows, setLoadingRows] = useState(true);
  const [showImport, setShowImport] = useState(false);
  const [csvText, setCsvText] = useState("");
  const [singleText, setSingleText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const [search, setSearch] = useState("");
  const [viewMode, setViewMode] = useState("longterm"); // 'longterm' | 'intraday' | 'sector'

  // portfolio
  const [capital, setCapital] = useState(100000);

  // SIP calculator
  const [sipAmount, setSipAmount] = useState(10000);
  const [sipReturn, setSipReturn] = useState(12);
  const [sipYears, setSipYears] = useState(10);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("watchlist");
        setWatchlist(res && res.value ? JSON.parse(res.value) : []);
      } catch {
        setWatchlist([]);
      } finally {
        setLoadingList(false);
      }
      try {
        const res2 = await storage.get("screener-rows");
        setRows(res2 && res2.value ? JSON.parse(res2.value) : [newScreenerRow()]);
      } catch {
        setRows([newScreenerRow()]);
      } finally {
        setLoadingRows(false);
      }
    })();
  }, []);

  async function persistWatchlist(list) {
    setWatchlist(list);
    try {
      await storage.set("watchlist", JSON.stringify(list));
    } catch {}
  }

  async function persistRows(list) {
    setRows(list);
    try {
      await storage.set("screener-rows", JSON.stringify(list));
    } catch {}
  }

  function update(key, val) {
    setForm((f) => ({ ...f, [key]: val }));
  }

  function runAnalysis() {
    const computed = computeScores(form);
    const price = parseFloat(form.currentPrice) || null;
    let longTerm = null;
    let intraday = null;
    if (price) {
      const ltUpside = computed.ltVerdict.label === "BUY" ? 0.18 : computed.ltVerdict.label === "HOLD" ? 0.08 : -0.05;
      longTerm = {
        entryLow: price * 0.97,
        entryHigh: price * 1.01,
        target: price * (1 + ltUpside),
        stopLoss: price * (computed.ltVerdict.label === "AVOID" ? 1.05 : 0.88),
      };
      const idDirection = computed.idVerdict.label === "AVOID" ? -1 : 1;
      intraday = {
        entry: price,
        stopLoss: price * (1 - idDirection * 0.012),
        target1: price * (1 + idDirection * 0.018),
        target2: price * (1 + idDirection * 0.03),
      };
    }
    setResult({ ticker: form.ticker || "UNNAMED", price, ...computed, longTerm, intraday });
  }

  async function saveToWatchlist() {
    if (!result) return;
    const entry = {
      id: `${result.ticker}-${Date.now()}`,
      ticker: result.ticker,
      price: result.price,
      date: new Date().toISOString(),
      fundamentalScore: result.fundamentalScore,
      technicalScore: result.technicalScore,
      longTermCombined: result.ltCombined,
      intradayCombined: result.idCombined,
      ltVerdict: result.ltVerdict,
      idVerdict: result.idVerdict,
      alertHigh: result.longTerm ? result.longTerm.target : "",
      alertLow: result.longTerm ? result.longTerm.stopLoss : "",
    };
    const next = [entry, ...watchlist.filter((w) => w.ticker !== result.ticker)];
    await persistWatchlist(next);
    setSaveMsg(`Saved ${result.ticker} to watchlist`);
    setTimeout(() => setSaveMsg(""), 2500);
  }

  async function removeFromWatchlist(id) {
    await persistWatchlist(watchlist.filter((w) => w.id !== id));
  }

  async function updateAlert(id, field, value) {
    await persistRowsSafeWatchlist(id, field, value);
  }
  async function persistRowsSafeWatchlist(id, field, value) {
    const next = watchlist.map((w) => (w.id === id ? { ...w, [field]: value } : w));
    await persistWatchlist(next);
  }

  // ----- screener handlers -----
  function updateRow(id, field, value) {
    persistRows(
      rows.map((r) => {
        if (r.id !== id) return r;
        const next = { ...r, [field]: value };
        // speed helper: auto-fill a typical industry P/E when sector changes and the field is still blank
        if (field === "sector" && (r.industryPe === "" || r.industryPe === undefined)) {
          next.industryPe = SECTOR_TYPICAL_PE[value] ?? "";
        }
        return next;
      })
    );
  }
  function addRow() {
    persistRows([...rows, newScreenerRow()]);
  }
  function removeRow(id) {
    persistRows(rows.filter((r) => r.id !== id));
  }
  function clearAllRows() {
    persistRows([newScreenerRow()]);
    setImportMsg("");
  }
  function loadDemo() {
    persistRows([...rows.filter((r) => r.ticker.trim() !== ""), ...demoRows()]);
    setImportMsg("Loaded 4 fictional demo stocks (DEMO-*) so you can see the rankings work — replace with real data.");
    setTimeout(() => setImportMsg(""), 5000);
  }
  function handleCSVImport() {
    if (!csvText.trim()) return;
    const { rows: imported, unmapped, count } = parseScreenerCSV(csvText);
    if (count === 0) {
      setImportMsg("Couldn't find any data rows — check that you pasted the CSV with its header row.");
      return;
    }
    persistRows([...rows.filter((r) => r.ticker.trim() !== ""), ...imported]);
    setCsvText("");
    setImportMsg(
      `Imported ${count} stock${count > 1 ? "s" : ""} from Screener.in export.` +
        (unmapped.length ? ` Couldn't auto-detect: ${unmapped.join(", ")} — fill those in manually.` : "") +
        " Sector defaults to Banking & Financials — adjust each row."
    );
    setTimeout(() => setImportMsg(""), 8000);
  }
  function handleSingleImport() {
    if (!singleText.trim()) return;
    const row = parseSingleStockText(singleText);
    persistRows([...rows.filter((r) => r.ticker.trim() !== ""), row]);
    setSingleText("");
    setImportMsg(`Added ${row.ticker} — check the detected fields and fill in anything blank (RSI, MACD, DMA, VWAP, pivot aren't on a Screener.in ratio page).`);
    setTimeout(() => setImportMsg(""), 8000);
  }

  const computedRows = useMemo(() => {
    return rows
      .filter((r) => r.ticker.trim() !== "")
      .map((r) => ({ ...r, ...computeScores(r) }));
  }, [rows]);

  const top10LongTerm = useMemo(
    () => [...computedRows].sort((a, b) => b.ltCombined - a.ltCombined).slice(0, 10),
    [computedRows]
  );
  const top10Intraday = useMemo(
    () => [...computedRows].sort((a, b) => b.idCombined - a.idCombined).slice(0, 10),
    [computedRows]
  );

  const displayRows = useMemo(() => {
    if (!search.trim()) return rows;
    const q = search.trim().toLowerCase();
    return rows.filter((r) => r.ticker.toLowerCase().includes(q) || r.sector.toLowerCase().includes(q));
  }, [rows, search]);

  const sectorLeaders = useMemo(() => {
    return SECTORS.map((s) => {
      const inSector = computedRows.filter((r) => r.sector === s);
      if (inSector.length === 0) return null;
      const bestLT = [...inSector].sort((a, b) => b.ltCombined - a.ltCombined)[0];
      const bestID = [...inSector].sort((a, b) => b.idCombined - a.idCombined)[0];
      return { sector: s, bestLT, bestID, count: inSector.length };
    }).filter(Boolean);
  }, [computedRows]);

  const sectorActual = useMemo(() => {
    const counts = {};
    SECTORS.forEach((s) => (counts[s] = 0));
    computedRows.forEach((r) => {
      counts[r.sector] = (counts[r.sector] || 0) + 1;
    });
    const total = computedRows.length || 1;
    const pct = {};
    SECTORS.forEach((s) => (pct[s] = (counts[s] / total) * 100));
    return { counts, pct, total: computedRows.length };
  }, [computedRows]);

  const summary = useMemo(() => {
    const buy = watchlist.filter((w) => w.ltVerdict?.label === "BUY").length;
    const hold = watchlist.filter((w) => w.ltVerdict?.label === "HOLD").length;
    const avoid = watchlist.filter((w) => w.ltVerdict?.label === "AVOID").length;
    return { buy, hold, avoid, total: watchlist.length };
  }, [watchlist]);

  const sipResult = useMemo(() => {
    const months = Math.max(1, Math.round(sipYears * 12));
    const r = sipReturn / 100 / 12;
    const invested = sipAmount * months;
    const futureValue = r === 0 ? invested : sipAmount * ((Math.pow(1 + r, months) - 1) / r) * (1 + r);
    return { invested, futureValue, gain: futureValue - invested };
  }, [sipAmount, sipReturn, sipYears]);

  const tickerTapeItems = watchlist.length ? watchlist : [{ ticker: "ADD STOCKS IN SCREENER", ltVerdict: { label: "—" } }];

  const TABS = [
    { id: "screener", label: "Screener", icon: TrendingUp },
    { id: "analyzer", label: "Analyzer", icon: LineChart },
    { id: "mutualfunds", label: "Mutual Funds", icon: PiggyBank },
    { id: "ipo", label: "IPOs", icon: Rocket },
    { id: "portfolio", label: "Portfolio", icon: PieChart },
    { id: "watchlist", label: "Watchlist", icon: ListChecks },
    { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
  ];

  return (
    <div className="min-h-screen w-full bg-slate-950 text-slate-100" style={{ fontFamily: "'Inter', sans-serif" }}>
      <style>{`${FONT_IMPORT}
        @keyframes tape { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .tape-track { animation: tape 24s linear infinite; }
        .display-font { font-family: 'Space Grotesk', sans-serif; }
        .mono-font { font-family: 'IBM Plex Mono', monospace; }
      `}</style>

      <div className="overflow-hidden border-b border-slate-800 bg-slate-900/60 py-2">
        <div className="tape-track flex w-max gap-8 whitespace-nowrap px-4">
          {[...tickerTapeItems, ...tickerTapeItems].map((w, i) => (
            <span key={i} className="mono-font text-xs text-slate-400">
              <span className="font-semibold text-slate-200">{w.ticker}</span>{" "}
              <span className={w.ltVerdict?.label === "BUY" ? "text-emerald-400" : w.ltVerdict?.label === "AVOID" ? "text-red-400" : "text-amber-400"}>
                {w.ltVerdict?.label}
              </span>
            </span>
          ))}
        </div>
      </div>

      <header className="border-b border-slate-800 px-6 py-5">
        <h1 className="display-font text-2xl font-bold tracking-tight text-slate-50">
          Signal<span className="text-indigo-400">Desk</span>
        </h1>
        <p className="mt-1 text-sm text-slate-500">
          Import from Screener.in, view live TradingView charts, get Long-term/Intraday/Sector rankings, browse mutual funds and IPOs, and balance your portfolio.
        </p>
      </header>

      <nav className="flex flex-wrap gap-1 border-b border-slate-800 px-6">
        {TABS.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex items-center gap-2 border-b-2 px-3 py-3 text-sm font-medium transition-colors ${active ? "border-indigo-400 text-slate-50" : "border-transparent text-slate-500 hover:text-slate-300"}`}>
              <Icon size={16} />
              {t.label}
            </button>
          );
        })}
      </nav>

      <main className="mx-auto max-w-6xl px-6 py-8">
        {tab === "screener" && (
          <div className="space-y-8">
            <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 p-4 text-xs text-amber-200">
              <div className="flex items-start gap-2">
                <Info size={14} className="mt-0.5 shrink-0" />
                <p>
                  No live NSE/BSE feed exists inside a browser page — Screener.in doesn't allow that either. Instead,
                  import real data from it below (CSV export or a pasted company page), or type numbers in manually.
                  Everything then auto-ranks instantly.
                </p>
              </div>
            </div>

            <div className="rounded-xl border border-slate-800 bg-slate-900/50">
              <button
                onClick={() => setShowImport((v) => !v)}
                className="flex w-full items-center justify-between px-5 py-4 text-left"
              >
                <span className="flex items-center gap-2 text-sm font-semibold text-slate-200">
                  <Upload size={16} className="text-indigo-400" /> Import from Screener.in
                </span>
                <span className="text-xs text-slate-500">{showImport ? "Hide" : "Show"}</span>
              </button>
              {showImport && (
                <div className="grid gap-4 border-t border-slate-800 p-5 lg:grid-cols-2">
                  <div>
                    <h3 className="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">
                      Bulk CSV — Screener.in custom screen export
                    </h3>
                    <p className="mb-2 text-[11px] text-slate-500">
                      On Screener.in, build a screen with Name, CMP, P/E, ROE, Debt to equity columns → Export → open
                      the file and paste its contents (including the header row) here.
                    </p>
                    <textarea
                      className={`${inputCls} h-28 resize-none`}
                      placeholder={"Name,CMP,P/E,ROE,Debt to equity\nHDFC Bank,950,16,17,0.2\nInfosys,1600,24,22,0.05"}
                      value={csvText}
                      onChange={(e) => setCsvText(e.target.value)}
                    />
                    <button onClick={handleCSVImport} className="mt-2 rounded-md bg-indigo-500 px-3 py-1.5 text-xs font-semibold text-white hover:bg-indigo-400">
                      Import CSV rows
                    </button>
                  </div>
                  <div>
                    <h3 className="mb-1 text-xs font-semibold uppercase tracking-wide text-slate-400">
                      Single stock — paste a Screener.in company page
                    </h3>
                    <p className="mb-2 text-[11px] text-slate-500">
                      Open a stock on Screener.in, select and copy the ratios area (Stock P/E, ROE, Debt to equity,
                      Current Price), and paste the raw text here.
                    </p>
                    <textarea
                      className={`${inputCls} h-28 resize-none`}
                      placeholder={"HDFC Bank\nCurrent Price 950\nStock P/E 16.2\nROE 17.4 %\nDebt to equity 0.2"}
                      value={singleText}
                      onChange={(e) => setSingleText(e.target.value)}
                    />
                    <button onClick={handleSingleImport} className="mt-2 rounded-md border border-slate-700 px-3 py-1.5 text-xs font-semibold text-slate-200 hover:border-indigo-400 hover:text-indigo-300">
                      Add stock from text
                    </button>
                  </div>
                </div>
              )}
              {importMsg && (
                <p className="border-t border-slate-800 px-5 py-3 text-xs text-emerald-400">{importMsg}</p>
              )}
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <div className="relative flex-1 min-w-[200px]">
                <Search size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                <input
                  className={`${inputCls} pl-9`}
                  placeholder="Search ticker or sector…"
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                />
                {search && (

                    <X size={14} />

              <button onClick={loadDemo} className="flex items-center gap-1.5 whitespace-nowrap rounded-md border border-slate-700 px-3 py-2 text-xs font-medium text-slate-300 hover:border-indigo-400 hover:text-indigo-300">

              <button onClick={clearAllRows} className="whitespace-nowrap rounded-md border border-slate-700 px-3 py-2 text-xs font-medium text-slate-400 hover:border-red-400 hover:text-red-300">
                Clear all

            </div>

            <div className="overflow-x-auto rounded-xl border border-slate-800">
              <table className="w-full min-w-[1100px] text-left text-xs">
                <thead className="bg-slate-900 uppercase tracking-wide text-slate-500">
                  <tr>

                    <th className="px-2 py-2">P/E</th>

                    <th className="px-2 py-2">VWAP</th>
                    <th className="px-2 py-2">Pivot</th>

                  {displayRows.length === 0 && (

                  )}
                  {displayRows.map((r) => (

                      <td className="px-2 py-1">
                        <select className={smallSelectCls} style={{ minWidth: 75 }} value={r.dma50} onChange={(e) => updateRow(r.id, "dma50", e.target.value)}>
                          {["Above", "Below"].map((o) => (<option key={o}>{o}</option>))}
                        </select>
                      </td>
                      <td className="px-2 py-1">
                        <select className={smallSelectCls} style={{ minWidth: 75 }} value={r.dma200} onChange={(e) => updateRow(r.id, "dma200", e.target.value)}>
                          {["Above", "Below"].map((o) => (<option key={o}>{o}</option>))}
                        </select>
                      </td>
                      <td className="px-2 py-1">
                        <select className={smallSelectCls} style={{ minWidth: 75 }} value={r.volume} onChange={(e) => updateRow(r.id, "volume", e.target.value)}>

                        </select>
                      </td>
                      <td className="px-2 py-1">
                        <select className={smallSelectCls} style={{ minWidth: 75 }} value={r.vwap} onChange={(e) => updateRow(r.id, "vwap", e.target.value)}>

                        </select>
                      </td>
                      <td className="px-2 py-1">
                        <select className={smallSelectCls} style={{ minWidth: 85 }} value={r.pivot} onChange={(e) => updateRow(r.id, "pivot", e.target.value)}>
                          <option value="AboveR1">Above R1</option>
                          <option value="Between">Between</option>
                          <option value="BelowS1">Below S1</option>
                        </select>
                      </td>
                      <td className="px-2 py-1">
                        <button onClick={() => removeRow(r.id)} className="text-slate-600 hover:text-red-400"><Trash2 size={14} /></button>
                      </td>
                    </tr>
                  ))}

            </div>
            <button onClick={addRow} className="flex items-center gap-2 rounded-md border border-slate-700 px-3 py-2 text-xs font-medium text-slate-300 hover:border-indigo-400 hover:text-indigo-300">
              <Plus size={14} /> Add stock row
            </button>

            <div className="flex gap-1 rounded-lg border border-slate-800 bg-slate-900/50 p-1">
              {[
                { id: "longterm", label: "Long-term", icon: Clock },
                { id: "intraday", label: "Intraday", icon: Zap },

              ].map((v) => {
                const Icon = v.icon;
                const active = viewMode === v.id;
                return (
                  <button

      </div>
      {list.length === 0 ? (
        <p className="text-xs text-slate-500">Add stocks in the table above to populate this ranking.</p>
      ) : (
        <ol className="space-y-2">
          {list.map((r, i) => {
            const t = toneClasses(r[verdictKey].tone);
            return (
              <li key={r.id} className="flex items-center justify-between rounded-lg bg-slate-950/60 px-3 py-2">
                <div className="flex items-center gap-3">
                  <span className="mono-font w-5 text-xs text-slate-600">{i + 1}</span>
                  <span className="font-semibold text-slate-200">{r.ticker}</span>
                  <span className="text-[10px] text-slate-500">{r.sector}</span>
                </div>
                <div className="flex items-center gap-3">
                  <span className="mono-font text-xs text-slate-400">{Math.round(r[scoreKey])}</span>
                  <span className={`rounded-full px-2 py-0.5 text-[10px] font-bold ${t.bg10} ${t.text}`}>{r[verdictKey].label}</span>
                </div>
              </li>
            );
          })}
        </ol>
      )}
    </div>
  );
}

function SectorLeaders({ leaders }) {
  if (leaders.length === 0) {
    return (
      <div className="rounded-xl border border-dashed border-slate-800 p-8 text-center text-slate-500">
        <Trophy size={24} className="mx-auto mb-2 text-slate-700" />
        <p className="text-sm">Add stocks with a sector tag above to see the best pick in each sector.</p>
      </div>
    );
  }
  return (
    <div className="grid gap-4 sm:grid-cols-2">
      {leaders.map(({ sector, bestLT, bestID, count }) => {
        const ltTone = toneClasses(bestLT.ltVerdict.tone);
        const idTone = toneClasses(bestID.idVerdict.tone);
        return (
          <div key={sector} className="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
            <div className="mb-3 flex items-center justify-between">
              <h3 className="text-sm font-semibold text-slate-200">{sector}</h3>
              <span className="text-[10px] text-slate-500">{count} stock{count > 1 ? "s" : ""}</span>
            </div>
            <div className="space-y-2">
              <div className="flex items-center justify-between rounded-lg bg-slate-950/60 px-3 py-2">
                <span className="text-[11px] text-slate-500">Long-term pick</span>
                <div className="flex items-center gap-2">
                  <span className="font-semibold text-slate-200">{bestLT.ticker}</span>
                  <span className={`rounded-full px-2 py-0.5 text-[10px] font-bold ${ltTone.bg10} ${ltTone.text}`}>{bestLT.ltVerdict.label}</span>
                </div>
              </div>
              <div className="flex items-center justify-between rounded-lg bg-slate-950/60 px-3 py-2">
                <span className="text-[11px] text-slate-500">Intraday pick</span>
                <div className="flex items-center gap-2">
                  <span className="font-semibold text-slate-200">{bestID.ticker}</span>
                  <span className={`rounded-full px-2 py-0.5 text-[10px] font-bold ${idTone.bg10} ${idTone.text}`}>{bestID.idVerdict.label}</span>
                </div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function StatCard({ label, value, tone }) {
  const map = { indigo: "text-indigo-400", emerald: "text-emerald-400", amber: "text-amber-400", red: "text-red-400" };
  return (
    <div className="rounded-xl border border-slate-800 bg-slate-900/50 p-4">
      <p className="text-xs uppercase tracking-wide text-slate-500">{label}</p>
      <p className={`mono-font mt-1 text-2xl font-semibold ${map[tone]}`}>{value}</p>
    </div>
  );
}

function VerdictCard({ icon: Icon, title, verdict, score, plan, type }) {
  const t = toneClasses(verdict.tone);
  return (
    <div className={`rounded-xl border ${t.border} bg-slate-900/50 p-5`}>
      <div className="mb-3 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <Icon size={16} className={t.text} />
          <h3 className="text-sm font-semibold text-slate-300">{title}</h3>
        </div>
        <span className={`rounded-full px-3 py-1 text-xs font-bold ${t.bg10} ${t.text}`}>{verdict.label} · {Math.round(score)}</span>
      </div>
      {plan ? (
        type === "longterm" ? (
          <div className="grid grid-cols-3 gap-3 text-center">
            <PlanBox label="Entry zone" value={`₹${plan.entryLow.toFixed(0)}–${plan.entryHigh.toFixed(0)}`} />
            <PlanBox label="Target (6–12mo)" value={`₹${plan.target.toFixed(0)}`} good />
            <PlanBox label="Stop / invalidation" value={`₹${plan.stopLoss.toFixed(0)}`} bad />
          </div>
        ) : (
          <div className="grid grid-cols-4 gap-3 text-center">
            <PlanBox label="Entry" value={`₹${plan.entry.toFixed(2)}`} />
            <PlanBox label="Stop-loss" value={`₹${plan.stopLoss.toFixed(2)}`} bad />
            <PlanBox label="Target 1" value={`₹${plan.target1.toFixed(2)}`} good />
            <PlanBox label="Target 2" value={`₹${plan.target2.toFixed(2)}`} good />
          </div>
        )
      ) : (
        <p className="text-xs text-slate-500">Enter current price to see entry / target / stop-loss levels.</p>
      )}
    </div>
  );
}

function PlanBox({ label, value, good, bad }) {
  return (
    <div className="rounded-lg bg-slate-950/60 p-2">
      <p className="text-[10px] uppercase tracking-wide text-slate-500">{label}</p>
      <p className={`mono-font text-sm font-semibold ${good ? "text-emerald-400" : bad ? "text-red-400" : "text-slate-200"}`}>{value}</p>
    </div>
  );
}


  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<StockAnalyzer />);
}
</script>
</body>
</html>
